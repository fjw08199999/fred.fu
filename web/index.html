<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每日英文 Daily English</title>
  <meta name="description" content="每天自動更新的英文學習網站：每日單字、例句片語、短文與小測驗。A daily English learning site." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="#top">每日英文 <span>Daily English</span></a>
      <div class="header-right">
        <span id="streak" class="streak" title="連續學習天數 / Study streak">🔥 0</span>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="切換深淺色 / Toggle theme">🌙</button>
      </div>
    </div>
  </header>

  <main id="top" class="container">
    <!-- Date / navigation -->
    <section class="daybar">
      <button id="prev-day" class="nav-btn" type="button">← 前一天 Prev</button>
      <div class="daybar-center">
        <p id="date-line" class="date-line">—</p>
        <p id="lesson-line" class="lesson-line">—</p>
      </div>
      <button id="next-day" class="nav-btn" type="button">後一天 Next →</button>
    </section>
    <div class="today-row">
      <button id="today-btn" class="link-btn" type="button">回到今天 Back to today</button>
      <label class="toggle">
        <input type="checkbox" id="zh-toggle" checked />
        <span>顯示中文 Show Chinese</span>
      </label>
    </div>

    <!-- Word of the day -->
    <section class="card card-word">
      <p class="card-label">📘 每日單字 · Word of the Day</p>
      <div class="word-head">
        <h2 id="word-term">—</h2>
        <button id="speak-word" class="icon-btn" type="button" aria-label="發音 / Pronounce">🔊</button>
      </div>
      <p class="word-meta"><span id="word-phonetic"></span> <span id="word-pos" class="pos"></span></p>
      <p id="word-zh" class="zh-text">—</p>
      <p id="word-def" class="def">—</p>
      <blockquote class="example">
        <p id="word-example">—</p>
        <p id="word-example-zh" class="zh-text small">—</p>
      </blockquote>
    </section>

    <!-- Phrase of the day -->
    <section class="card card-phrase">
      <p class="card-label">💬 每日片語 · Phrase of the Day</p>
      <div class="word-head">
        <h2 id="phrase-en">—</h2>
        <button id="speak-phrase" class="icon-btn" type="button" aria-label="發音 / Pronounce">🔊</button>
      </div>
      <p id="phrase-zh" class="zh-text">—</p>
      <blockquote class="example">
        <p id="phrase-usage">—</p>
      </blockquote>
    </section>

    <!-- Reading of the day -->
    <section class="card card-reading">
      <p class="card-label">📖 每日短文 · Reading of the Day</p>
      <h2 id="reading-title">—</h2>
      <p id="reading-title-zh" class="zh-text small">—</p>
      <p id="reading-en" class="reading-body">—</p>
      <p id="reading-zh" class="zh-text reading-body">—</p>
      <div class="vocab">
        <span class="vocab-label">重點單字 Key words：</span>
        <ul id="reading-vocab" class="vocab-list"></ul>
      </div>
    </section>

    <!-- Quiz of the day -->
    <section class="card card-quiz">
      <p class="card-label">📝 每日小測驗 · Daily Quiz</p>
      <form id="quiz-form"></form>
      <div class="quiz-actions">
        <button id="quiz-submit" class="btn btn-primary" type="button">批改 Check</button>
        <button id="quiz-reset" class="btn btn-ghost" type="button">重做 Retry</button>
      </div>
      <p id="quiz-result" class="quiz-result" hidden></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>每天回來學一點，日積月累就是進步。Come back daily — small steps add up.</p>
      <p class="muted">內容每日自動更新，共 <span id="total-lessons">—</span> 課循環。</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
